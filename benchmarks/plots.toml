# Paths are relative to the repository root. Each source is exactly one run.
# List every independent workload dimension so every table case must explicitly fix it.
[sources.clique_core]
path = "benchmarks/results/clique-core-windows-20260928.csv"
x = "n"
method = "method"
dimensions = ["dtype", "family", "order", "weights", "seed", "weight_dtype"]

[sources.clique_polars]
path = "benchmarks/results/clique-polars-windows-20260928.timings.csv"
x = "n"
method = "weights"
dimensions = ["family", "order", "dtype", "groups", "chunks", "engine", "seed", "algorithm"]

[[tables]]
id = "clique-polars-table"
source = "clique_polars"
value = "ns"
divisor = 1000000
ylabel = "Polars query time (ms)"
methods = { unit = "No weights", explicit_unit = "All weights = 1", positive = "Positive weights", mixed = "Positive and negative weights" }
cases = [
  { label = "Up to 8 overlapping, shuffled integers", sizes = [1000, 100000, 1000000], filters = { family = "low8", order = "shuffled", dtype = "i64", groups = 1, chunks = 1, engine = "auto", seed = 42, algorithm = "production" } },
  { label = "All overlap, shuffled dates", sizes = [1000000], filters = { family = "clique", order = "shuffled", dtype = "date", groups = 1, chunks = 1, engine = "auto", seed = 42, algorithm = "production" } },
  { label = "Up to 8 overlapping, shuffled UTC datetimes, streaming", sizes = [1000000], filters = { family = "low8", order = "shuffled", dtype = "datetime_ns_utc", groups = 1, chunks = 7, engine = "streaming", seed = 42, algorithm = "production" } },
  { label = "32 groups, shuffled integers, multiple chunks", sizes = [1000, 1000000], filters = { family = "low8", order = "shuffled", dtype = "i64", groups = 32, chunks = 7, engine = "auto", seed = 42, algorithm = "production" } },
]

[[tables]]
id = "clique-core-table"
source = "clique_core"
value = "total_ns"
divisor = 1000000
ylabel = "Algorithm time (ms)"
methods = { production = "Package algorithm", events_index = "Endpoint scan", streams = "Packed endpoint lists", heap = "Active-interval heap" }
cases = [
  { label = "Up to 64 overlapping, shuffled, no weights", sizes = [100000, 1000000], filters = { dtype = "i64", family = "moderate", order = "shuffled", weights = "units", seed = 7, weight_dtype = "unit" } },
  { label = "Up to 2 overlapping, shuffled, 128-bit weights", sizes = [100000, 1000000], filters = { dtype = "i64", family = "low2", order = "shuffled", weights = "positive", seed = 7, weight_dtype = "i128" } },
  { label = "Repeated endpoints, shuffled, 128-bit weights", sizes = [1000000], filters = { dtype = "i64", family = "repeated", order = "shuffled", weights = "positive", seed = 7, weight_dtype = "i128" } },
  { label = "All overlap, shuffled, 128-bit weights", sizes = [1000000], filters = { dtype = "i64", family = "full", order = "shuffled", weights = "positive", seed = 7, weight_dtype = "i128" } },
  { label = "Non-overlapping, shuffled, 64-bit weights", sizes = [100000], filters = { dtype = "i64", family = "disjoint", order = "shuffled", weights = "positive", seed = 7, weight_dtype = "i64" } },
]

