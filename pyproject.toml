[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "polars-intervals"
requires-python = ">=3.12"
dependencies = ["polars>=1.44.1,<1.45"]
license-files = ["LICENSE"]
dynamic = ["version"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]
docs = ["mkdocs-material>=9.7,<10", "mkdocstrings[python]>=1,<2"]

[tool.maturin]
manifest-path = "crates/polars-intervals/Cargo.toml"
python-source = "python"
module-name = "polars_intervals._internal"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
