name: Release

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: "2"

jobs:
  prepare:
    name: Check release configuration
    runs-on: ubuntu-24.04
    outputs:
      build_required: ${{ steps.changes.outputs.build_required }}
      rust_toolchain: ${{ steps.versions.outputs.rust_toolchain }}
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check changed files
        id: changes
        run: python .github/scripts/ci_changes.py
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check package versions and compiler policy
        id: versions
        run: uv run --locked --only-group dev python .github/scripts/release_checks.py versions
      - name: Test CI and release checks
        run: uv run --locked --only-group dev pytest .github/scripts/test_*.py

  wheels:
    name: Wheel (${{ matrix.platform.name }}, Python ${{ matrix.python }})
    needs: prepare
    if: needs.prepare.outputs.build_required == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Select build and test interpreters
        id: interpreters
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/artifact-env"
          test_python=$(uv python find "$RUNNER_TEMP/artifact-env")
          printf 'test_python=%s\n' "$test_python" >> "$GITHUB_OUTPUT"
          if [[ "$RUNNER_OS" == Linux ]]; then
            python_tag="cp${PYTHON_VERSION//./}"
            build_python="/opt/python/$python_tag-$python_tag/bin/python"
          else
            build_python="$test_python"
          fi
          printf 'build_python=%s\n' "$build_python" >> "$GITHUB_OUTPUT"
      - name: Build release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: true
          maturin-version: v1.15.0
          rust-toolchain: ${{ needs.prepare.outputs.rust_toolchain }}
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
          args: >-
            --release --locked --compatibility pypi --out dist
            --interpreter "${{ steps.interpreters.outputs.build_python }}"
      - name: Install and test the wheel outside the checkout
        env:
          TEST_PYTHON: ${{ steps.interpreters.outputs.test_python }}
        run: |
          uv export --locked --only-group dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/test-requirements.txt"
          cd "$RUNNER_TEMP"
          uv pip install --python "$TEST_PYTHON" --requirement "$RUNNER_TEMP/test-requirements.txt" "$GITHUB_WORKSPACE"/dist/*.whl
          "$TEST_PYTHON" -I "$GITHUB_WORKSPACE/.github/scripts/release_checks.py" installed --checkout "$GITHUB_WORKSPACE"
      - name: Test the declared minimum Polars version
        if: matrix.platform.name == 'linux-x86_64' && matrix.python == '3.12'
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/minimum-env"
          test_python=$(uv python find "$RUNNER_TEMP/minimum-env")
          cd "$RUNNER_TEMP"
          uv pip install --python "$test_python" --requirement "$RUNNER_TEMP/test-requirements.txt" "polars==1.44.1" "$GITHUB_WORKSPACE"/dist/*.whl
          "$test_python" -I "$GITHUB_WORKSPACE/.github/scripts/release_checks.py" installed --checkout "$GITHUB_WORKSPACE"
      - name: Upload tested wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform.name }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build and install source distribution
    needs: prepare
    if: needs.prepare.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          rust-toolchain: ${{ needs.prepare.outputs.rust_toolchain }}
          command: sdist
          args: --out dist
      - name: Install and test the sdist outside the checkout
        run: |
          uv export --locked --only-group dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/test-requirements.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/artifact-env"
          test_python=$(uv python find "$RUNNER_TEMP/artifact-env")
          cd "$RUNNER_TEMP"
          uv pip install --no-cache --python "$test_python" --config-setting=build-args=--locked --requirement "$RUNNER_TEMP/test-requirements.txt" "$GITHUB_WORKSPACE"/dist/*.tar.gz
          "$test_python" -I "$GITHUB_WORKSPACE/.github/scripts/release_checks.py" installed --checkout "$GITHUB_WORKSPACE"
      - name: Upload tested source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify complete distribution set
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Audit wheel matrix and package metadata
        run: uv run --locked --only-group dev python .github/scripts/release_checks.py artifacts dist
      - name: Check distribution metadata with Twine
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  release-guard:
    name: Verify final release commit
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check tag, master ancestry, and successful normal CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --only-group dev python .github/scripts/release_checks.py release

  pypi:
    name: Publish verified distributions to PyPI
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [verify, release-guard]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/polars-intervals
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
