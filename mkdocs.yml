site_name: polars-intervals
site_description: Interval algorithms for Polars
site_url: https://jplauri.github.io/polars-intervals/
repo_url: https://github.com/jplauri/polars-intervals
repo_name: jplauri/polars-intervals
site_dir: target/docs
watch: [CONTRIBUTING.md, benchmarks, python]
exclude_docs: |
  assets/benchmarks/*.md
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Getting started: index.md
  - Usage: usage.md
  - API reference: api.md
  - Benchmarks:
      - Overview: benchmarks.md
      - Overlap counting: overlap-count-benchmarks.md
      - Containment counting: containment-benchmarks.md
      - Nesting depth: nesting-depth-benchmarks.md
      - Lane assignment: assign-lanes-benchmarks.md
      - Lane balancing: balance-lanes-benchmarks.md
      - Weighted scheduling: weighted-scheduling-benchmarks.md
      - Maximum-weight clique: clique-benchmarks.md
      - Capacity scheduling: capacity-scheduling-benchmarks.md
      - Capacity profiles: capacity-profile-benchmarks.md
      - Minimum covering: covering-benchmarks.md
      - Minimum-cost covering: cost-covering-benchmarks.md
      - Minimum-cost dominating set: domination-benchmarks.md
      - Minimum stabbing points: stabbing-benchmarks.md
      - Maximum k-coverage: coverage-benchmarks.md
      - Running and publishing: benchmarking.md
  - Release notes: changelog.md
  - Development:
      - Contributing: contributing.md
      - Releasing: releasing.md
plugins:
  - search:
      separator: '[\s\-_.]+'
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            allow_inspection: false
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            separate_signature: true
            show_signature_annotations: true
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
