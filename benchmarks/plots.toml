# Paths are relative to the repository root. Each source is exactly one run.
# List every independent workload dimension so every table case or chart must explicitly fix it.
[sources.overlap]
path = "benchmarks/results/sweep-windows.json"
x = "rows"
method = "method"
dimensions = ["scenario", "groups", "order", "dtype"]

[sources.lanes]
path = "benchmarks/results/assign-lanes-windows.csv"
x = "n"
method = "algorithm"
dimensions = ["family", "order"]

[sources.weighted]
path = "benchmarks/results/weighted-windows.csv"
x = "n"
method = "algorithm"
dimensions = ["family", "order", "weights"]

[sources.capacity]
path = "benchmarks/results/capacity-windows.csv"
x = "n"
method = "algorithm"
dimensions = ["family", "order", "weights", "k"]

[sources.covering]
path = "benchmarks/results/covering-windows.csv"
x = "n"
method = "method"
dimensions = ["family", "order", "costs"]

[sources.stabbing]
path = "benchmarks/results/stabbing-windows.csv"
x = "n"
method = "method"
dimensions = ["dtype", "family", "order"]

[sources.nesting]
path = "benchmarks/results/nesting-kernels-windows.csv"
x = "n"
method = "method"
dimensions = ["dtype", "scenario", "groups"]

[sources.nesting_polars]
path = "benchmarks/results/nesting-polars-windows.csv"
x = "n"
method = "dtype"
dimensions = ["groups", "family", "order", "candidate"]

[sources.capacity_temporal]
path = "benchmarks/results/capacity-temporal-windows.csv"
x = "n"
method = "dtype"
dimensions = ["k"]

[sources.profile]
path = "benchmarks/results/capacity-profile-core.csv"
x = "n"
method = "algorithm"
dimensions = ["family", "pattern", "order", "m", "k"]

[sources.profile_temporal]
path = "benchmarks/results/capacity-profile-temporal.csv"
x = "n"
method = "dtype"
dimensions = ["m", "pattern", "algorithm"]

[sources.covering_temporal]
path = "benchmarks/results/covering-temporal-windows.csv"
x = "n"
method = "dtype"
dimensions = ["family", "order", "method"]

[sources.stabbing_temporal]
path = "benchmarks/results/stabbing-temporal-windows.csv"
x = "n"
method = "dtype"
dimensions = ["family", "order"]

[[tables]]
id = "capacity-polars-table"
source = "capacity_temporal"
value = "ns"
divisor = 1000000
ylabel = "Collection time (ms), production"
methods = { Int64 = "Int64", Date = "Date", "Datetime(time_unit='us', time_zone=None)" = "Datetime (µs)" }
cases = [
  {label = "32-row cliques, k=1", sizes = [1000000], filters = {k = 1}},
  {label = "32-row cliques, k=2", sizes = [1000000], filters = {k = 2}},
  {label = "32-row cliques, k=31", sizes = [1000000], filters = {k = 31}},
  {label = "32-row cliques, k=32", sizes = [1000000], filters = {k = 32}},
]

[[tables]]
id = "capacity-core-table"
source = "capacity"
value = "ns"
divisor = 1000000
ylabel = "Rust runtime (ms)"
methods = { production = "Production", components = "Serial components", whole = "Whole flow", generic = "Generic flow" }
cases = [
  {label = "Disjoint, k=2", sizes = [1000000], filters = {family = "disjoint", order = "shuffled", weights = "positive", k = 2}},
  {label = "Dense, k=2", sizes = [1000000], filters = {family = "dense", order = "shuffled", weights = "positive", k = 2}},
  {label = "Identical intervals, k=2", sizes = [1000000], filters = {family = "identical", order = "shuffled", weights = "positive", k = 2}},
  {label = "Components, k=2", sizes = [10000, 1000000], filters = {family = "components", order = "shuffled", weights = "positive", k = 2}},
  {label = "Components, k=8", sizes = [100000], filters = {family = "components", order = "shuffled", weights = "positive", k = 8}},
  {label = "Components, k=16 (sufficient)", sizes = [100000], filters = {family = "components", order = "shuffled", weights = "positive", k = 16}},
]

[[tables]]
id = "profile-polars-table"
source = "profile_temporal"
value = "ns"
divisor = 1000000
ylabel = "Complete Polars API time (ms), production"
methods = { Int64 = "Int64", Date = "Date", "Datetime(time_unit='us', time_zone=None)" = "Datetime (µs)" }
cases = [
  {label = "Constant capacity 4", sizes = [1000000], filters = {m = 1, pattern = "constant", algorithm = "profile"}},
  {label = "Sufficient capacity", sizes = [1000000], filters = {m = 1, pattern = "high", algorithm = "profile"}},
  {label = "Variable capacity 2/4/6/8", sizes = [100000], filters = {m = 3125, pattern = "varying", algorithm = "profile"}},
  {label = "Variable capacity 2/4/6/8, larger", sizes = [1000000], filters = {m = 31250, pattern = "varying", algorithm = "profile"}},
]

[[tables]]
id = "profile-formulations-table"
source = "profile"
value = "ns"
divisor = 1000000
ylabel = "Rust runtime (ms)"
methods = { production = "Production", csr = "Forced transshipment", csr_C = "Forced circulation" }
cases = [
  {label = "Moderate overlap, 1K profile segments", sizes = [10000], filters = {family = "moderate", pattern = "small_changes", order = "sorted", m = 1000, k = 4}},
  {label = "Moderate overlap, 10K profile segments", sizes = [10000], filters = {family = "moderate", pattern = "small_changes", order = "sorted", m = 10000, k = 4}},
]

[[tables]]
